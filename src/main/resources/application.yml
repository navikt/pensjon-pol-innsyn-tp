management:
  endpoints.web.exposure.include: prometheus, health
  endpoint:
    prometheus:
      access: read_only
spring:
  cloud.azure.active-directory:
    enabled: true
    app-id-uri: api://${AZURE_APP_CLIENT_ID}
    application-type: web_application_and_resource_server
    authorization-clients:
      azure:
        authorization-grant-type: authorization_code
        scopes:
          - ${scope}
      tp:
        authorization-grant-type: on_behalf_of
        scopes:
          - ${tp.scope}
    credential:
      client-id: ${AZURE_APP_CLIENT_ID}
      client-secret: ${AZURE_APP_CLIENT_SECRET}
    profile:
      tenant-id: ${AZURE_APP_TENANT_ID}
  web:
    error:
      include-message: always
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %replace{%msg}{\b(\d{6})\d{5}\b}{$1*****}%n'
  structured:
    format:
      console: logstash
      file: logstash
